services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aurik_monitoring
      POSTGRES_USER: aurik
      POSTGRES_PASSWORD: aurik
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurik -d aurik_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
