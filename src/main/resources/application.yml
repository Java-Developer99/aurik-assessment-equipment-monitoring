spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aurik_monitoring}
    username: ${DB_USERNAME:aurik}
    password: ${DB_PASSWORD:aurik}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
app:
  processing:
    stale-minutes: ${STALE_MINUTES:30}
